<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>PiCode</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-logo">π</div>
          <div>
            <div class="brand-name">PiCode</div>
            <div class="brand-sub" id="brand-sub">pi 编程助手</div>
          </div>
        </div>
        <button class="btn-new-chat" id="btn-new-chat">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          新会话
        </button>
        <div class="project-row" id="project-row" title="点击更换项目文件夹">
          <svg class="project-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 2h4.5A1.5 1.5 0 0 1 14 6.5v5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7z" stroke="currentColor" stroke-width="1.3"/></svg>
          <span class="project-name" id="project-name">未选择项目</span>
        </div>
      </div>
      <div class="section-label"><span>会话</span><button id="btn-browse-sessions">全部 ›</button></div>
      <div class="session-list" id="session-list"></div>
      <div class="sidebar-foot">
        <button class="side-btn" id="btn-settings">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          设置
        </button>
        <button class="side-btn" id="btn-stats">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2.5 13.5v-5M6.5 13.5v-9M10.5 13.5V7M14 13.5H2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          会话用量
          <span class="pill-dot off" id="pi-state-dot"></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="transcript-wrap" id="transcript-wrap">
        <div class="transcript" id="transcript"></div>
      </div>
      <div id="banner-zone"></div>
      <div class="composer-zone">
        <div class="pre-composer">
          <div class="ext-widget hidden" id="ext-widget"></div>
          <div class="queue-row" id="queue-row"></div>
        </div>
        <div class="composer" id="composer">
          <div class="palette" id="palette">
            <div class="p-head" id="palette-head">输入 / 使用指令</div>
            <div class="p-list" id="palette-list"></div>
          </div>
          <div class="attach-strip" id="attach-strip"></div>
          <div class="composer-input-row">
            <button class="icon-btn" id="btn-attach" title="附加图片">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/><circle cx="5.6" cy="6.2" r="1.2" fill="currentColor"/><path d="M2.5 11l3.2-3 2.6 2.4L11 7.6l2.5 2.6" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <textarea id="composer-input" rows="1" placeholder="给 pi 发送消息，或输入 / 使用指令，! 运行命令"></textarea>
            <button class="send-btn" id="btn-send" title="发送 (Enter)">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8.5 3.5L13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="statusbar" id="statusbar">
          <span class="status-pill" id="pill-model" title="选择模型 (Ctrl+P)"><span class="p-txt">未选择模型</span></span>
          <span class="status-pill hidden" id="pill-thinking" title="思考等级 (/thinking)"><span class="p-txt"></span></span>
          <span class="status-pill hidden" id="pill-ctx" title="上下文用量"><div class="ctx-bar"><div class="fill" id="ctx-fill" style="width:0%"></div></div><span class="p-txt" id="ctx-text"></span></span>
          <span class="status-cost" id="status-cost"></span>
          <span class="status-spacer"></span>
          <span class="status-queue hidden" id="status-queue"></span>
          <span class="stream-ind hidden" id="stream-ind"><span class="s-dot"></span><span id="stream-label">运行中</span></span>
          <span class="hidden" id="ext-status"></span>
        </div>
      </div>
    </main>
  </div>

  <input type="file" id="file-input" accept="image/*" multiple class="hidden" />
  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>
  <script src="./app.js"></script>
</body>
</html>
